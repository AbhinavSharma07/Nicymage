[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nicymage"
version = "0.1.0"
description = "Local-first container image security auditor"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
nicymage = "nicymage.cli:main"

[tool.setuptools.packages.find]
include = ["nicymage*"]
